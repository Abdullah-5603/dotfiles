##########################################
# A kitty config by null
#########################################

# Font
font_family FiraCode Nerd Font Mono
disable_ligatures never
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto
modify_font cell_height 110%
modify_font strikethrough_position 110%

# cursor
# cursor #ffcb47
# cursor_text_color #000000
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval -1
cursor_trail 20

# scrollback
scrollback_lines 5000
scrollback_indicator_opacity 1.0

# mouse
mouse_hide_wait -1

#url
# url_color #0087bd
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes
show_hyperlink_targets no
underline_hyperlink always
strip_trailing_spaces always

# stop the sound of the bell
enable_audio_bell no
visual_bell_duration 0.0
command_on_bell none

# window
remember_window_size  yes
initial_window_width  640
initial_window_height 400
enable_layouts *
hide_window_decorations yes

# border
window_border_width 2pt
draw_minimal_border yes
window_margin_width 5
window_padding_width 5

# background
# background_image ~/.config/kitty/wallpaper.png
# background_image_layout scaled
# background_tint 0.95
# dim_opacity 1

# remote control support
allow_remote_control yes
remote_control_password "nullx" get-colors set-colors focus-window focus-tab
remote_control_password "nullx" set-tab-* resize-*
kitten @ --help

# clipbaord
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# shell integration
shell_integration enabled

# # include theme
# include ~/.config/kitty/dracula.conf


# BEGIN_KITTY_THEME
include ~/.config/omarchy/current/theme/kitty.conf
# END_KITTY_THEME
